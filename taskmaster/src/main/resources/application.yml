spring:
  datasource:
    url: jdbc:h2:mem:taskmaster;DB_CLOSE_DELAY=-1
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: taskmaster-secret-key-1234567890-very-long
  expiration-ms: 86400000

server:
  port: 8080
